---
- name: Install Python packages needed by poll
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
    state: present

- name: Create poll application directory
  ansible.builtin.file:
    path: "{{ app_dir }}/poll"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
    recurse: no

- name: Copy poll application archive to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/poll.tar"
    dest: "{{ app_dir }}/poll.tar"
    owner: root
    group: root
    mode: "0644"
  register: poll_copy_changed

- name: Extract poll application
  ansible.builtin.unarchive:
    src: "{{ app_dir }}/poll.tar"
    dest: "{{ app_dir }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
  when: poll_copy_changed.changed

- name: Install poll Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/poll/requirements.txt"
    executable: pip3
    break_system_packages: true

- name: Create poll environment file
  ansible.builtin.copy:
    dest: /etc/default/poll
    owner: root
    group: root
    mode: "0644"
    content: |
      REDIS_HOST={{ hostvars[groups['redis'][0]].ansible_host | default(groups['redis'][0]) }}
      REDIS_USER={{ redis_user }}
      REDIS_PASSWORD={{ redis_password }}
  register: poll_env_changed

- name: Install poll systemd service
  ansible.builtin.template:
    src: poll.service
    dest: /etc/systemd/system/poll.service
    owner: root
    group: root
    mode: "0644"
  register: poll_service_changed

- name: Reload systemd for poll service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check if poll needs to be restarted
  ansible.builtin.set_fact:
    poll_changed: "{{ poll_copy_changed.changed or poll_env_changed.changed or poll_service_changed.changed }}"

- name: Enable and start poll service
  ansible.builtin.systemd:
    name: poll
    enabled: true
    state: started
  when: not poll_changed

- name: Restart poll service if configuration changed
  ansible.builtin.systemd:
    name: poll
    enabled: true
    state: restarted
  when: poll_changed

- import_tasks: ufw.yml
