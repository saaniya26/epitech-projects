---
- name: Install ufw package
  ansible.builtin.apt:
    name:
      - ufw
    state: present

- name: Allow SSH traffic on port 22
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow HTTP traffic on port 80
  community.general.ufw:
    rule: allow
    port: 80
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
