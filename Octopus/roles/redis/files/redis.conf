################################## NETWORK #####################################

# Accept connections from all interfaces to enable communication between
# poll (source) and worker (target) hosts
bind 0.0.0.0

# Protected mode disabled to allow connections from other hosts
# Note: Ensure proper firewall rules are in place for security
protected-mode yes

# Redis port - used for inter-host communication
port 6379

# TCP listen() backlog for queue handling
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

################################ GENERAL #####################################

# By default Redis does not run as a daemon
daemonize no

# Set the server verbosity to 'notice'
loglevel notice

# Append only format
appendonly no

# Save the DB on disk
save 900 1
save 300 10
save 60 10000

# Compress string objects in RDB when len > 0
rdbcompression yes

# RDB checksum
rdbchecksum yes

# Filename for the RDB file
dbfilename dump.rdb

# The working directory
dir /var/lib/redis

# The filename prefix for AOF files
appendfilename "appendonly.aof"

# AOF fsync policy
appendfsync everysec

# Prevent fsync during large bgsave/bgrewriteaof
no-appendfsync-on-rewrite no

################################### PERSISTENCE ###############################

# Hybrid mode combines AOF and RDB
aof-use-rdb-preamble no

################################# SNAPSHOTS #####################################

# Minimum number of clients connected
min-slaves-to-write 0

# Minimum slave lag in seconds
min-slaves-max-lag 10

################################ QUEUE HANDLING ###############################

# Limit for client output buffer to prevent memory issues
maxclients 10000

# Maximum memory Redis can use
# Leave unset to use system defaults
# maxmemory 256mb

# Memory eviction policy
# noeviction - don't evict anything, just return error
maxmemory-policy allkeys-lru

################################# EXPIRATION ####################################

# Expire keys in the background
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

#################################### LAZY FREE ################################

# Delete replicas of evicted keys asynchronously
replica-lazy-flush no

############################## MONITORING METRICS ##############################

# Enable latency monitoring
latency-monitor-threshold 0

############################## CLIENTS ########################################

# Timeout for idle clients (0 = no timeout)
timeout 0

# Maximum number of connections
# Adjust based on poll/worker host requirements
maxclients 10000

user {{ redis_user }} on >{{ redis_password }} ~* +@all
user default off
