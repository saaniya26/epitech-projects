---
- name: Install ufw package
  ansible.builtin.apt:
    name:
      - ufw
    state: present

- name: Allow SSH traffic on port 22
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow Redis traffic on port {{ redis_port | default(6379) }}
  community.general.ufw:
    rule: allow
    port: "{{ redis_port | default(6379) }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
