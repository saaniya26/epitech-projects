---
- name: Install ufw package
  ansible.builtin.apt:
    name:
      - ufw
    state: present

- name: Allow SSH traffic on port 22
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow PostgreSQL traffic on port {{ db_port | default(5432) }}
  community.general.ufw:
    rule: allow
    port: "{{ db_port | default(5432) }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
